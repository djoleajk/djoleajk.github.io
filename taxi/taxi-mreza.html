<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Valjevo Taxi Mreža</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f4f4f5;
    --surface: #ffffff;
    --surface2: #f9f9fb;
    --border: #e4e4e7;
    --text: #18181b;
    --text2: #52525b;
    --text3: #a1a1aa;
    --accent: #3b82f6;
    --accent-d: #2563eb;
    --green: #22c55e;
    --orange: #f97316;
    --red: #ef4444;
    --amber: #f59e0b;
    --radius: 10px;
  }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  #auth-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
  .auth-card { background: var(--surface); border-radius: 16px; padding: 32px 24px; width: 100%; max-width: 360px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); }
  .auth-logo { text-align: center; margin-bottom: 24px; }
  .auth-logo-icon { font-size: 48px; display: block; margin-bottom: 8px; }
  .auth-logo h1 { font-size: 22px; font-weight: 700; color: var(--text); }
  .auth-logo p { font-size: 13px; color: var(--text2); margin-top: 4px; }
  .form-group { margin-bottom: 14px; }
  .form-group label { display: block; font-size: 13px; color: var(--text2); margin-bottom: 5px; font-weight: 500; }
  .form-group input { width: 100%; border: 1.5px solid var(--border); border-radius: var(--radius); padding: 10px 12px; font-size: 14px; color: var(--text); background: var(--surface); transition: border 0.15s; }
  .form-group input:focus { outline: none; border-color: var(--accent); }
  .btn { border: none; border-radius: var(--radius); padding: 11px 16px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.15s; width: 100%; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-d); }
  .btn-secondary { background: var(--bg); color: var(--text); border: 1.5px solid var(--border); }
  .btn-secondary:hover { background: var(--border); }
  .btn-danger { background: #fee2e2; color: #b91c1c; border: 1.5px solid #fca5a5; }
  .btn-sm { padding: 7px 12px; font-size: 12px; width: auto; }
  .auth-switch { text-align: center; margin-top: 16px; font-size: 13px; color: var(--text2); }
  .auth-switch a { color: var(--accent); cursor: pointer; text-decoration: none; font-weight: 500; }

  #main-app { display: none; max-width: 480px; margin: 0 auto; min-height: 100vh; }
  .topbar { background: #1e1b4b; color: #fff; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
  .topbar-left h2 { font-size: 16px; font-weight: 700; }
  .topbar-left span { font-size: 12px; color: #a5b4fc; display: flex; align-items: center; gap: 5px; margin-top: 1px; }
  .online-dot { width: 7px; height: 7px; background: #4ade80; border-radius: 50%; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
  .btn-logout { background: rgba(255,255,255,0.12); border: none; color: #fff; border-radius: 8px; padding: 6px 10px; font-size: 12px; cursor: pointer; }
  .btn-logout:hover { background: rgba(255,255,255,0.2); }

  .tabs { display: flex; background: var(--surface); border-bottom: 1.5px solid var(--border); position: sticky; top: 57px; z-index: 99; }
  .tab-btn { flex: 1; padding: 12px 4px; font-size: 13px; font-weight: 500; color: var(--text3); border: none; background: none; cursor: pointer; border-bottom: 2.5px solid transparent; transition: all 0.15s; display: flex; align-items: center; justify-content: center; gap: 5px; }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
  .notif-count { background: var(--red); color: #fff; font-size: 10px; padding: 1px 5px; border-radius: 10px; font-weight: 700; min-width: 16px; text-align: center; }

  .screen { display: none; padding: 12px; }
  .screen.active { display: block; }

  .section-title { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.8px; margin: 12px 0 8px; font-weight: 600; }
  .ride-card { background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 13px; margin-bottom: 8px; }
  .ride-card.urgent { border-left: 4px solid var(--amber); }
  .ride-card.taken { opacity: 0.6; }
  .ride-card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .ride-route { font-size: 14px; font-weight: 600; line-height: 1.3; }
  .ride-time { font-size: 12px; color: var(--text2); margin-top: 2px; font-weight: 400; }
  .badge { display: inline-block; font-size: 11px; padding: 3px 8px; border-radius: 20px; font-weight: 600; white-space: nowrap; }
  .badge-wait { background: #fef9c3; color: #713f12; }
  .badge-urgent { background: #fef3c7; color: #92400e; }
  .badge-taken { background: #dcfce7; color: #14532d; }
  .badge-done { background: #f4f4f5; color: #52525b; }
  .ride-meta { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--text2); margin: 9px 0; }
  .ride-actions { display: flex; gap: 7px; flex-wrap: wrap; }
  .ride-creator { font-size: 11px; color: var(--text3); margin-top: 8px; }

  .empty-state { text-align: center; padding: 48px 20px; color: var(--text3); }
  .empty-state .empty-icon { font-size: 40px; display: block; margin-bottom: 12px; }
  .empty-state p { font-size: 14px; }

  .new-ride-card { background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
  .new-ride-card h3 { font-size: 15px; font-weight: 600; margin-bottom: 14px; }
  .form-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .urgent-toggle { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .urgent-toggle input[type=checkbox] { width: 16px; height: 16px; cursor: pointer; }
  .urgent-toggle label { font-size: 13px; color: var(--text2); cursor: pointer; font-weight: 500; }

  .driver-card { background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 8px; display: flex; align-items: center; gap: 12px; }
  .driver-avatar { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; flex-shrink: 0; }
  .driver-info { flex: 1; }
  .driver-name { font-size: 14px; font-weight: 600; }
  .driver-status { font-size: 12px; color: var(--text2); margin-top: 2px; display: flex; align-items: center; gap: 5px; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .s-free { background: var(--green); }
  .s-busy { background: var(--orange); }
  .s-offline { background: var(--text3); }
  .driver-badge { font-size: 10px; padding: 2px 7px; border-radius: 20px; font-weight: 600; }
  .badge-admin { background: #ede9fe; color: #5b21b6; }
  .badge-me { background: #dbeafe; color: #1e40af; }

  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(80px); background: #18181b; color: #fff; padding: 10px 20px; border-radius: 30px; font-size: 13px; font-weight: 500; z-index: 999; transition: transform 0.3s; opacity: 0; white-space: nowrap; }
  #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
</style>
</head>
<body>

<div id="auth-screen">
  <div class="auth-card">
    <div class="auth-logo">
      <span class="auth-logo-icon">🚖</span>
      <h1>Valjevo Taxi Mreža</h1>
      <p>Dispatcher sistem za vozače</p>
    </div>
    <div id="login-form">
      <div class="form-group">
        <label>Email adresa</label>
        <input type="email" id="login-email" placeholder="voz@example.com">
      </div>
      <div class="form-group">
        <label>Lozinka</label>
        <input type="password" id="login-pass" placeholder="••••••••">
      </div>
      <button class="btn btn-primary" onclick="loginUser()">Prijavi se</button>
      <div class="auth-switch">Nemaš nalog? <a onclick="toggleAuth()">Registruj se</a></div>
    </div>
    <div id="register-form" style="display:none">
      <div class="form-group">
        <label>Ime i prezime</label>
        <input type="text" id="reg-name" placeholder="Marko Jovanović">
      </div>
      <div class="form-group">
        <label>Email adresa</label>
        <input type="email" id="reg-email" placeholder="marko@example.com">
      </div>
      <div class="form-group">
        <label>Telefon</label>
        <input type="tel" id="reg-phone" placeholder="06x-xxx-xxxx">
      </div>
      <div class="form-group">
        <label>Lozinka (min. 6 karaktera)</label>
        <input type="password" id="reg-pass" placeholder="••••••••">
      </div>
      <button class="btn btn-primary" onclick="registerUser()">Kreiraj nalog</button>
      <div class="auth-switch">Već imaš nalog? <a onclick="toggleAuth()">Prijavi se</a></div>
    </div>
    <div id="auth-error" style="color:#b91c1c;font-size:12px;margin-top:10px;text-align:center;display:none"></div>
  </div>
</div>

<div id="main-app">
  <div class="topbar">
    <div class="topbar-left">
      <h2>🚖 Taxi Mreža</h2>
      <span><span class="online-dot"></span> <span id="user-name-display">Vozač</span></span>
    </div>
    <button class="btn-logout" onclick="logoutUser()">Odjavi se</button>
  </div>
  <div class="tabs">
    <button class="tab-btn active" onclick="showScreen('voznje', this)">
      🚗 Vožnje <span class="notif-count" id="notif-count" style="display:none">0</span>
    </button>
    <button class="tab-btn" onclick="showScreen('nova', this)">➕ Nova</button>
    <button class="tab-btn" onclick="showScreen('vozaci', this)">👥 Vozači</button>
  </div>

  <div id="screen-voznje" class="screen active">
    <div id="rides-container">
      <div class="empty-state"><span class="empty-icon">⏳</span><p>Učitavanje vožnji...</p></div>
    </div>
  </div>

  <div id="screen-nova" class="screen">
    <div class="new-ride-card">
      <h3>Nova vožnja</h3>
      <div class="form-group">
        <label>Polazište</label>
        <input type="text" id="new-from" placeholder="npr. Valjevo, centar">
      </div>
      <div class="form-group">
        <label>Odredište</label>
        <input type="text" id="new-to" placeholder="npr. Aerodrom Beograd">
      </div>
      <div class="form-row-2">
        <div class="form-group">
          <label>Datum</label>
          <input type="date" id="new-date">
        </div>
        <div class="form-group">
          <label>Vreme</label>
          <input type="time" id="new-time">
        </div>
      </div>
      <div class="form-row-2">
        <div class="form-group">
          <label>Br. putnika</label>
          <input type="number" id="new-passengers" placeholder="1" min="1" max="8">
        </div>
        <div class="form-group">
          <label>Cena (din)</label>
          <input type="number" id="new-price" placeholder="0" min="0">
        </div>
      </div>
      <div class="form-group">
        <label>Telefon putnika</label>
        <input type="tel" id="new-phone" placeholder="06x-xxx-xxxx">
      </div>
      <div class="form-group">
        <label>Napomena</label>
        <input type="text" id="new-note" placeholder="npr. prtljag, specijalni zahtev...">
      </div>
      <div class="urgent-toggle">
        <input type="checkbox" id="new-urgent">
        <label for="new-urgent">⚠️ Hitna vožnja</label>
      </div>
      <button class="btn btn-primary" onclick="createRide()">Objavi vožnju</button>
    </div>
  </div>

  <div id="screen-vozaci" class="screen">
    <div id="drivers-container">
      <div class="empty-state"><span class="empty-icon">👥</span><p>Učitavanje vozača...</p></div>
    </div>
    <div style="padding: 12px 0; text-align: center;">
      <button class="btn btn-secondary btn-sm" onclick="toggleAvailability()">Promeni status (slobodan/zauzet)</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getDatabase, ref, set, push, onValue, update, remove, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

const firebaseConfig = {
  apiKey: "AIzaSyCB4hWUdUfKb86PS_bT-zeJ1snsGKautjc",
  authDomain: "valjevo-taxi-91b1e.firebaseapp.com",
  databaseURL: "https://valjevo-taxi-91b1e-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "valjevo-taxi-91b1e",
  storageBucket: "valjevo-taxi-91b1e.firebasestorage.app",
  messagingSenderId: "901144673761",
  appId: "1:901144673761:web:18053dd747d4b249a266a0",
  measurementId: "G-TQ1NEQ7YDW"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app, "https://valjevo-taxi-91b1e-default-rtdb.europe-west1.firebasedatabase.app");

let currentUser = null;
let currentUserData = null;

onAuthStateChanged(auth, (user) => {
  if (user) {
    currentUser = user;
    const userRef = ref(db, 'vozaci/' + user.uid);
    onValue(userRef, (snap) => {
      currentUserData = snap.val();
      if (currentUserData) {
        document.getElementById('user-name-display').textContent = currentUserData.ime;
        update(ref(db, 'vozaci/' + user.uid), { online: true, posledniOnline: serverTimestamp() });
      }
    });
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('main-app').style.display = 'block';
    loadRides();
    loadDrivers();
  } else {
    currentUser = null;
    document.getElementById('auth-screen').style.display = 'flex';
    document.getElementById('main-app').style.display = 'none';
  }
});

window.loginUser = async () => {
  const email = document.getElementById('login-email').value.trim();
  const pass = document.getElementById('login-pass').value;
  try {
    await signInWithEmailAndPassword(auth, email, pass);
    showToast('Dobrodošli! ✓');
  } catch(e) { showAuthError(getErrorMsg(e.code)); }
};

window.registerUser = async () => {
  const ime = document.getElementById('reg-name').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const telefon = document.getElementById('reg-phone').value.trim();
  const pass = document.getElementById('reg-pass').value;
  if (!ime || !email || !pass) { showAuthError('Popunite sva polja'); return; }
  if (pass.length < 6) { showAuthError('Lozinka mora imati min. 6 karaktera'); return; }
  try {
    const cred = await createUserWithEmailAndPassword(auth, email, pass);
    await set(ref(db, 'vozaci/' + cred.user.uid), {
      ime, email, telefon, uid: cred.user.uid,
      slobodan: true, online: true,
      posledniOnline: serverTimestamp(),
      admin: false
    });
    showToast('Nalog kreiran! ✓');
  } catch(e) { showAuthError(getErrorMsg(e.code)); }
};

window.logoutUser = async () => {
  if (currentUser) await update(ref(db, 'vozaci/' + currentUser.uid), { online: false });
  await signOut(auth);
};

window.toggleAuth = () => {
  const lf = document.getElementById('login-form');
  const rf = document.getElementById('register-form');
  lf.style.display = lf.style.display === 'none' ? 'block' : 'none';
  rf.style.display = rf.style.display === 'none' ? 'block' : 'none';
  document.getElementById('auth-error').style.display = 'none';
};

function loadRides() {
  onValue(ref(db, 'voznje'), (snap) => {
    renderRides(snap.val());
  });
}

function renderRides(data) {
  const container = document.getElementById('rides-container');
  if (!data) {
    container.innerHTML = '<div class="empty-state"><span class="empty-icon">🚗</span><p>Nema vožnji. Kreirajte prvu!</p></div>';
    document.getElementById('notif-count').style.display = 'none';
    return;
  }
  const rides = Object.entries(data).map(([id, v]) => ({ id, ...v }));
  rides.sort((a, b) => {
    if (a.status === 'ceka' && b.status !== 'ceka') return -1;
    if (a.hitna && !b.hitna) return -1;
    return (b.kreirano || 0) - (a.kreirano || 0);
  });
  const waiting = rides.filter(r => r.status === 'ceka');
  const taken = rides.filter(r => r.status !== 'ceka');
  const nc = document.getElementById('notif-count');
  nc.style.display = waiting.length > 0 ? 'inline' : 'none';
  nc.textContent = waiting.length;
  let html = '';
  if (waiting.length) {
    html += '<div class="section-title">Čekaju prihvatanje (' + waiting.length + ')</div>';
    waiting.forEach(r => { html += rideCardHTML(r); });
  }
  if (taken.length) {
    html += '<div class="section-title">Prihvaćene / Završene</div>';
    taken.forEach(r => { html += rideCardHTML(r); });
  }
  container.innerHTML = html;
}

function rideCardHTML(r) {
  const isMine = currentUser && r.kreatorId === currentUser.uid;
  const taken = r.status === 'preuzeto' || r.status === 'zavrseno';
  let badgeHTML = '';
  if (r.hitna && r.status === 'ceka') badgeHTML = '<span class="badge badge-urgent">⚠️ Hitno</span>';
  else if (r.status === 'ceka') badgeHTML = '<span class="badge badge-wait">Čeka</span>';
  else if (r.status === 'preuzeto') badgeHTML = '<span class="badge badge-taken">✓ ' + (r.preuzeoIme || 'Preuzeto') + '</span>';
  else badgeHTML = '<span class="badge badge-done">Završeno</span>';
  let actionsHTML = '';
  if (r.status === 'ceka' && currentUser && r.kreatorId !== currentUser.uid) {
    actionsHTML += `<button class="btn btn-primary btn-sm" onclick="acceptRide('${r.id}')">Prihvati</button>`;
  }
  if (r.status === 'preuzeto' && currentUser && r.preuzeoBroj === currentUser.uid) {
    actionsHTML += `<button class="btn btn-secondary btn-sm" onclick="completeRide('${r.id}')">Završi</button>`;
    actionsHTML += `<button class="btn btn-danger btn-sm" onclick="cancelRide('${r.id}')">Otkaži</button>`;
  }
  if (isMine && r.status === 'ceka') {
    actionsHTML += `<button class="btn btn-danger btn-sm" onclick="deleteRide('${r.id}')">Obriši</button>`;
  }
  return `
    <div class="ride-card ${r.hitna && r.status === 'ceka' ? 'urgent' : ''} ${taken ? 'taken' : ''}">
      <div class="ride-card-header">
        <div>
          <div class="ride-route">${r.od} → ${r.do}</div>
          <div class="ride-time">📅 ${r.datum || ''} u ${r.vreme || ''}</div>
        </div>
        ${badgeHTML}
      </div>
      <div class="ride-meta">
        ${r.putnici ? `<span>👥 ${r.putnici} put.</span>` : ''}
        ${r.cena ? `<span>💰 ${Number(r.cena).toLocaleString('sr')} din</span>` : ''}
        ${r.telefon ? `<span>📞 ${r.telefon}</span>` : ''}
        ${r.napomena ? `<span>💬 ${r.napomena}</span>` : ''}
      </div>
      ${actionsHTML ? '<div class="ride-actions">' + actionsHTML + '</div>' : ''}
      <div class="ride-creator">Kreirao: ${isMine ? 'ti' : (r.kreatorIme || 'nepoznat')}</div>
    </div>`;
}

window.createRide = async () => {
  if (!currentUser) return;
  const od = document.getElementById('new-from').value.trim();
  const doo = document.getElementById('new-to').value.trim();
  const datum = document.getElementById('new-date').value;
  const vreme = document.getElementById('new-time').value;
  if (!od || !doo || !datum || !vreme) { showToast('Popunite obavezna polja ⚠️'); return; }
  try {
    await push(ref(db, 'voznje'), {
      od, do: doo, datum, vreme,
      putnici: document.getElementById('new-passengers').value || '1',
      cena: document.getElementById('new-price').value || '',
      telefon: document.getElementById('new-phone').value.trim(),
      napomena: document.getElementById('new-note').value.trim(),
      hitna: document.getElementById('new-urgent').checked,
      status: 'ceka',
      kreatorId: currentUser.uid,
      kreatorIme: currentUserData ? currentUserData.ime : 'Vozač',
      kreirano: serverTimestamp()
    });
    ['new-from','new-to','new-passengers','new-price','new-phone','new-note'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('new-date').value = new Date().toISOString().split('T')[0];
    document.getElementById('new-time').value = '';
    document.getElementById('new-urgent').checked = false;
    showToast('Vožnja objavljena! ✓');
    document.querySelector('.tab-btn').click();
  } catch(e) { showToast('Greška: ' + e.message); }
};

window.acceptRide = async (id) => {
  if (!currentUser || !currentUserData) return;
  await update(ref(db, 'voznje/' + id), {
    status: 'preuzeto', preuzeoBroj: currentUser.uid,
    preuzeoIme: currentUserData.ime, preuzeoVreme: serverTimestamp()
  });
  await update(ref(db, 'vozaci/' + currentUser.uid), { slobodan: false });
  showToast('Vožnja prihvaćena! ✓');
};

window.completeRide = async (id) => {
  await update(ref(db, 'voznje/' + id), { status: 'zavrseno', zavrsenoVreme: serverTimestamp() });
  if (currentUser) await update(ref(db, 'vozaci/' + currentUser.uid), { slobodan: true });
  showToast('Vožnja završena ✓');
};

window.cancelRide = async (id) => {
  await update(ref(db, 'voznje/' + id), { status: 'ceka', preuzeoBroj: null, preuzeoIme: null });
  if (currentUser) await update(ref(db, 'vozaci/' + currentUser.uid), { slobodan: true });
  showToast('Vožnja vraćena u red');
};

window.deleteRide = async (id) => {
  if (confirm('Obrisati ovu vožnju?')) {
    await remove(ref(db, 'voznje/' + id));
    showToast('Vožnja obrisana');
  }
};

function loadDrivers() {
  onValue(ref(db, 'vozaci'), (snap) => { renderDrivers(snap.val()); });
}

function renderDrivers(data) {
  const container = document.getElementById('drivers-container');
  if (!data) { container.innerHTML = '<div class="empty-state"><span class="empty-icon">👥</span><p>Nema registrovanih vozača</p></div>'; return; }
  const drivers = Object.entries(data).map(([id, v]) => ({ id, ...v }));
  drivers.sort((a, b) => (b.online ? 1 : 0) - (a.online ? 1 : 0));
  const colors = ['#dbeafe|#1e40af','#dcfce7|#14532d','#fce7f3|#9d174d','#ede9fe|#5b21b6','#fef3c7|#92400e'];
  let html = '';
  drivers.forEach((d, i) => {
    const isMe = currentUser && d.uid === currentUser.uid;
    const [bg, fg] = colors[i % colors.length].split('|');
    const initials = d.ime ? d.ime.split(' ').map(w => w[0]).join('').toUpperCase().slice(0,2) : '??';
    const statusDot = d.online ? (d.slobodan ? 's-free' : 's-busy') : 's-offline';
    const statusText = d.online ? (d.slobodan ? 'Slobodan' : 'Zauzet / Na vožnji') : 'Offline';
    html += `
      <div class="driver-card">
        <div class="driver-avatar" style="background:${bg};color:${fg}">${initials}</div>
        <div class="driver-info">
          <div class="driver-name">${d.ime || 'Nepoznat'}</div>
          <div class="driver-status"><span class="status-dot ${statusDot}"></span>${statusText}</div>
        </div>
        <div style="display:flex;gap:4px;flex-direction:column;align-items:flex-end">
          ${d.admin ? '<span class="driver-badge badge-admin">Admin</span>' : ''}
          ${isMe ? '<span class="driver-badge badge-me">Ti</span>' : ''}
        </div>
      </div>`;
  });
  container.innerHTML = html;
}

window.toggleAvailability = async () => {
  if (!currentUser || !currentUserData) return;
  const newStatus = !currentUserData.slobodan;
  await update(ref(db, 'vozaci/' + currentUser.uid), { slobodan: newStatus });
  showToast(newStatus ? 'Status: Slobodan ✓' : 'Status: Zauzet ✓');
};

window.showScreen = (name, el) => {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
  el.classList.add('active');
};

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

function showAuthError(msg) {
  const el = document.getElementById('auth-error');
  el.textContent = msg;
  el.style.display = 'block';
}

function getErrorMsg(code) {
  const map = {
    'auth/email-already-in-use': 'Ovaj email je već registrovan',
    'auth/invalid-email': 'Neispravna email adresa',
    'auth/wrong-password': 'Pogrešna lozinka',
    'auth/user-not-found': 'Korisnik nije pronađen',
    'auth/weak-password': 'Lozinka je preslab (min. 6 karaktera)',
    'auth/too-many-requests': 'Previše pokušaja. Sačekajte malo.',
    'auth/invalid-credential': 'Pogrešan email ili lozinka'
  };
  return map[code] || 'Greška: ' + code;
}

document.getElementById('new-date').value = new Date().toISOString().split('T')[0];
